name: CI

on:
  workflow_dispatch:
    inputs:
      run_gpu_tests:
        description: Run the CUDA extension tests on a GPU runner
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Allow julia-actions/cache to remove caches it created.
permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.12'
            os: ubuntu-latest
            arch: x64
          - version: '1.12'
            os: windows-latest
            arch: x64
          - version: '1.12'
            os: macos-15-intel
            arch: x64
          - version: '1.12'
            os: ubuntu-24.04-arm
            arch: aarch64
          - version: '1.12'
            os: macos-14
            arch: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.arch }}
          path: lcov.info
          if-no-files-found: error

  cuda-extension:
    name: CUDA extension loading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Install extension test dependencies
        shell: julia --project=test/cuda {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - run: julia --project=test/cuda --code-coverage=user test/cuda/runtests.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-cuda-extension
          path: lcov.info
          if-no-files-found: error

  cuda-runtime:
    name: CUDA runtime
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu_tests
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Install extension test dependencies
        shell: julia --project=test/cuda {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - run: julia --project=test/cuda --code-coverage=user test/cuda/runtests.jl
        env:
          MOREAU_TEST_CUDA: '1'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-cuda-runtime
          path: lcov.info
          if-no-files-found: error

  musl:
    name: Julia 1.12 - musl Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test musl JLL in Alpine
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            julia:1.12-alpine \
            julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
