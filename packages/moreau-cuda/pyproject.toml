[build-system]
requires = [
    "scikit-build-core>=0.5",
    "nanobind>=2.11.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "moreau-cuda"
version = "0.4.0-beta.1"
description = "Moreau CUDA: GPU-accelerated conic optimization solver"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Parth Nobel", email = "parthnobel@berkeley.edu"}, {name = "Steven Diamond", email = "diamond@cs.stanford.edu"}, {name = "Shane Barratt"}]
requires-python = ">=3.12"
keywords = ["convex", "optimization", "conic", "solver", "gpu", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "moreau>=0.4.0-beta.1",
    "numpy>=1.19.0",
    # Bounds must match the cuDSS the wheel was built against
    # (Dockerfile.wheel): cudssConfigParam_t enum values shift between
    # minor versions, so a mismatched runtime is silently misconfigured.
    "nvidia-cudss-cu12>=0.7.1,<0.8",
    "cuda-toolkit[cusolver,cusparse,cudart,nvjitlink] ==12.*",
]

[project.optional-dependencies]
torch = ["torch>=2.4.0"]

[project.urls]
Homepage = "https://github.com/moreau-project/moreau"
Repository = "https://github.com/moreau-project/moreau"
Documentation = "https://github.com/moreau-project/moreau"

[tool.scikit-build]
wheel.py-api = "cp312"
wheel.packages = ["moreau_cuda"]
# Ship LICENSE + NOTICE in the wheel's dist-info/licenses.
wheel.license-files = ["LICENSE", "NOTICE"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"

[tool.uv.sources]
moreau = { workspace = true }

[project.entry-points."moreau.backends"]
cuda = "moreau_cuda:_register"
