[package]
name = "moreau-cpu"
version = "0.4.0"
edition = "2021"
rust-version = "1.70.0"
description = "Moreau CPU solver - conic interior point optimization"
keywords = ["convex", "optimization", "conic", "solver", "linear-programming"]
categories = ["mathematics"]
license = "Apache-2.0"
repository = "https://github.com/moreau-project/moreau"
homepage = "https://github.com/moreau-project/moreau"
readme = "../../README.md"

#required for openssl to work on git actions
resolver = "1"     

[dependencies]
amd            = "0.2.2"
cfg-if         = "1.0"
itertools      = "0.11"
derive_builder = "0.11"
enum_dispatch  = "0.3.8"
lazy_static    = "1.4"
num-traits     = "0.2"
thiserror      = "1.0"
rayon          = "1.10"


# -------------------------------
# features
# -------------------------------

[features]
default = ["faer-sparse", "active-set"]

# CPU active-set QP solver (C++ via cmake)
active-set = ["dep:cmake"]

# enables blas/lapack for SDP support, with blas/lapack src unspecified
# also enable packages required for chordal decomposition
sdp = ["blas","lapack", "indexmap"]

# enable detailed build info reporting
buildinfo = ["dep:vergen"]

# explicit configuration options for different blas flavours
sdp-accelerate = ["sdp", "blas-src/accelerate", "lapack-src/accelerate"]
sdp-netlib     = ["sdp", "blas-src/netlib", "lapack-src/netlib", "netlib-src"]
sdp-openblas   = ["sdp", "blas-src/openblas", "lapack-src/openblas", "openblas-src"]
sdp-mkl        = ["sdp", "blas-src/intel-mkl", "lapack-src/intel-mkl","intel-mkl-src"]
sdp-r          = ["sdp", "blas-src/r", "lapack-src/r"]

# build as the python interface via maturin.
# python builds will default to use scipy shared libraries
# for blas/lapack if none of the options above are specified.
# This is the behaviour used when building the python wheels
# for distribution on pypi

python = [
    "dep:derive_more",
    "dep:num-derive",
    "dep:libc",
    "dep:pyo3",
    "buildinfo",
    "faer-sparse",
    "sdp",
    "active-set",
]

# compile with faer supernodal solver option
faer-sparse = ["dep:faer", "dep:faer-traits"]

# various pardiso options
pardiso-panua = ["pardiso-wrapper/panua"]
pardiso-mkl = ["pardiso-wrapper/mkl"]
pardiso = ["pardiso-panua", "pardiso-mkl"]

# compile with more exhaustive benchmarking tests
bench = []

# C API for non-Python FFI consumers
c-api = []

# -------------------------------
# SDP configuration
# -------------------------------

[dependencies.blas]
version = "0.22.0"
optional = true

[dependencies.lapack]
version = "0.19.0"
optional = true

[dependencies.blas-src]
version = "0.11.1"
optional = true 

[dependencies.lapack-src]
version = "0.11.0"
optional = true 

[target.'cfg(not(windows))'.dependencies.openblas-src]
version = "0.10.11"
features = ["static"]
optional = true

[target.'cfg(windows)'.dependencies.openblas-src]
version = "0.10.11"
features = ["system"]
optional = true

[dependencies.intel-mkl-src]
version = "0.8.1"
features = ["mkl-static-lp64-iomp"]
optional = true

[dependencies.netlib-src]
version = "0.8.0"
features = ["static"]
optional = true

[dependencies.indexmap]
version = "2.2"
optional = true

# -------------------------------
# 3rd party sparse LDL solvers
# -------------------------------

[dependencies.faer]
version = "0.21.9"
optional = true 

[dependencies.faer-traits]
version = "0.21.5"
optional = true 

[dependencies.pardiso-wrapper]
version = "0.1"
optional = true


# -------------------------------
# examples
# -------------------------------

[[example]]
name = "qp"
path = "examples/rust/qp.rs"

[[example]]
name = "lp"
path = "examples/rust/lp.rs"

[[example]]
name = "socp"
path = "examples/rust/socp.rs"

[[example]]
name = "expcone"
path = "examples/rust/expcone.rs"

[[example]]
name = "powcone"
path = "examples/rust/powcone.rs"

[[example]]
name = "box"
path = "examples/rust/box.rs"

[[example]]
name = "batch"
path = "examples/rust/batch.rs"

[[example]]
name = "large_qp_batched"
path = "examples/rust/large_qp_batched.rs"

[[example]]
name = "sdp_batch_chordal"
path = "examples/rust/sdp_batch_chordal.rs"
required-features = ["sdp"]

[[example]]
name = "sos_mpc"
path = "examples/rust/sos_mpc.rs"
required-features = ["sdp"]

[[example]]
name = "bench_sdp"
path = "examples/rust/bench_sdp.rs"
required-features = ["sdp"]

[[example]]
name = "bench_solvers"
path = "examples/rust/bench_solvers.rs"

[[example]]
name = "bench_riccati"
path = "examples/rust/bench_riccati.rs"

[[example]]
name = "bench_genpow_pd_scaling"
path = "examples/rust/bench_genpow_pd_scaling.rs"

[[example]]
name = "bench_genpow_parity"
path = "examples/rust/bench_genpow_parity.rs"

[[example]]
name = "bench_genpow_corrector"
path = "examples/rust/bench_genpow_corrector.rs"

[[example]]
name = "bench_xcone_asymmetric"
path = "examples/rust/bench_xcone_asymmetric.rs"

[[example]]
name = "bench_xcone_genpow_pd"
path = "examples/rust/bench_xcone_genpow_pd.rs"

# -------------------------------
# integration tests
# -------------------------------

# C API input-validation tests — gated on `c-api` feature so they only
# build/run when the FFI symbols are available.
[[test]]
name = "c_api_input_validation"
path = "tests/c_api_input_validation.rs"
required-features = ["c-api"]

# -------------------------------
# custom build profiles
# -------------------------------

# Release profile — fat LTO, single codegen unit, stripped symbols for
# small + fast binaries. Same settings propagated to all dependencies so
# faer/amd/pyo3 are optimised at the same level.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false

[profile.release.package."*"]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false

[profile.release.build-override]
opt-level = 3
debug = false

[profile.release-with-debug]
inherits = "release"
debug = true
strip = "none"


# ------------------------------
# Optional python interface
# ------------------------------

[dependencies.num-derive]
optional = true 
version = "0.4"



# derive_more is used to implement the Debug trait
# used for display python objects.  Increases MSRV
# to 1.75, so not used by default.
[dependencies.derive_more]
optional = true
version = "2.0"
features = ["debug"]


[dependencies.libc]
optional = true 
version = "0.2"

[dependencies.pyo3]
optional = true
version = "0.25"
# "extension-module" tells pyo3 we want to build an extension module (skips linking against libpython.so)
# "abi3-py39" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.9
features = ["extension-module", "abi3-py39"]

[lib]
name = "moreau"
# "cdylib" for Python extension, "rlib" for Rust tests/integration, "staticlib" for C API
crate-type = ["cdylib", "rlib", "staticlib"]


# ------------------------------
# enable latex in docs 
# credit: https://github.com/victe/rust-latex-doc-minimal-example
# ------------------------------

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "./html/rustdocs-header.html" ]
features = ["sdp","sdp-mkl"]

# ------------------------------
# wasm compatibility
# ------------------------------

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "0.2.3"
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"


# ------------------------------
# detailed build info
# ------------------------------
[build-dependencies]
cmake = { version = "0.1", optional = true }

[build-dependencies.vergen]
optional = true
version = "9.0"
features = ["build", "cargo", "rustc", "si"]

# ------------------------------
# testing, benchmarking etc
# ------------------------------
[dev-dependencies]
tempfile = "3"
rand = "0.8"


[[example]]
name = "bench_soc"
path = "examples/rust/bench_soc.rs"
