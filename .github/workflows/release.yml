# Build all artifacts and create a GitHub Release for QA.
#
# This is stage 1 of a 3-stage release pipeline:
#   1. release.yml    — build wheels, create GitHub Release (this workflow)
#   2. test-release.yml — test wheels from a GitHub Release (re-triggerable)
#   3. publish.yml    — push Python wheels to PyPI
#
# Usage:
#   gh workflow run release.yml
#   gh workflow run release.yml -f version=0.4.0 -f release_name=v0.4.0

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version (e.g., 0.4.0). Leave empty for a timestamped dev version.'
        required: false
        type: string
      release_name:
        description: 'GitHub release/tag (e.g., v0.4.0). Leave empty for dev-YYYYMMDD-HHMMSS.'
        required: false
        type: string

env:
  CUDSS_VERSION: "0.7.1.4"

jobs:
  # ===========================================================================
  # Resolve version from input or pyproject.toml
  # ===========================================================================
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            BASE=$(grep '^version = ' packages/moreau/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            VERSION="${BASE}.dev$(date -u +%Y%m%d%H%M%S)"
          fi
          python3 scripts/bump_version.py "$VERSION" --pin-dependencies
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

  # ===========================================================================
  # Python wheels
  # ===========================================================================

  # CPU wheel: Linux x86_64 + aarch64 (manylinux_2_28, Rust/maturin, abi3-py39)
  build-cpu-wheel-linux:
    needs: [resolve-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - name: Build CPU wheel in manylinux container
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          docker run --rm \
            -e RUST_TARGET \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/packages/moreau-cpu \
            "quay.io/pypa/manylinux_2_28_${ARCH}" \
            bash -c '
              set -e
              # Install Rust
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env

              # Install maturin using manylinux Python 3.12
              /opt/python/cp312-cp312/bin/pip install maturin

              # Build wheel (manylinux tag is automatic inside manylinux container)
              /opt/python/cp312-cp312/bin/maturin build --release --target "$RUST_TARGET"

              echo "Built wheel:"
              ls -la target/wheels/

              # Scrub binary strings (must run inside container to have write permission)
              /opt/python/cp312-cp312/bin/python scripts/scrub_binary.py target/wheels/*.whl
              # Strip Python comments from .py files in the wheel
              /opt/python/cp312-cp312/bin/python /workspace/packages/moreau/scripts/scrub_python_wheel.py target/wheels/*.whl
              echo "Wheel scrubbed successfully"

              # Fix permissions for artifacts
              chmod -R 777 target/wheels
            '

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-cpu-linux-${{ matrix.arch }}
          path: packages/moreau-cpu/target/wheels/*.whl
          retention-days: 1

  # CPU wheel: macOS ARM64 (Apple Silicon, native build)
  build-cpu-wheel-macos:
    needs: [resolve-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - uses: dtolnay/rust-toolchain@stable

      - name: Build CPU wheel
        run: |
          pip install maturin
          cd packages/moreau-cpu
          maturin build --release

      - name: Scrub binary and strip comments
        run: |
          python3 packages/moreau-cpu/scripts/scrub_binary.py packages/moreau-cpu/target/wheels/*.whl
          python3 packages/moreau/scripts/scrub_python_wheel.py packages/moreau-cpu/target/wheels/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-cpu-macos
          path: packages/moreau-cpu/target/wheels/*.whl
          retention-days: 1

  # GPU wheels: CUDA 12.2 and 13.0 × {x86_64, aarch64} (Docker, nanobind abi3-py312).
  # aarch64 uses PyTorch cu128 (first index with aarch64 CUDA wheels; cu121 is
  # x86_64-only). CUDA_ARCHITECTURES drops sm_75 on aarch64 (no Turing on ARM
  # server SoCs) and adds sm_87 for Jetson Orin.
  build-gpu-wheel:
    needs: [resolve-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: "12.2"
            cuda_short: "cu122"
            cuda_major: "12"
            cudss_suffix: "cuda12"
            pytorch_index: "cu121"
            gcc_toolset: "12"
            package_name: "moreau-cuda12"
            arch: "x86_64"
            cuda_arch_label: "x86_64"
            runner: ubuntu-latest
          - cuda_version: "12.2"
            cuda_short: "cu122"
            cuda_major: "12"
            cudss_suffix: "cuda12"
            pytorch_index: "cu128"
            gcc_toolset: "12"
            package_name: "moreau-cuda12"
            arch: "aarch64"
            cuda_arch_label: "sbsa"
            runner: ubuntu-24.04-arm
          - cuda_version: "13.0"
            cuda_short: "cu130"
            cuda_major: "13"
            cudss_suffix: "cuda13"
            pytorch_index: "cu130"
            gcc_toolset: "13"
            package_name: "moreau-cuda13"
            arch: "x86_64"
            cuda_arch_label: "x86_64"
            runner: ubuntu-latest
          - cuda_version: "13.0"
            cuda_short: "cu130"
            cuda_major: "13"
            cudss_suffix: "cuda13"
            pytorch_index: "cu130"
            gcc_toolset: "13"
            package_name: "moreau-cuda13"
            arch: "aarch64"
            cuda_arch_label: "sbsa"
            runner: ubuntu-24.04-arm

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Patch version and package name in pyproject.toml
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          PACKAGE: ${{ matrix.package_name }}
          CUDA_MAJOR: ${{ matrix.cuda_major }}
        run: |
          python3 scripts/bump_version.py "$VERSION" --pin-dependencies
          echo "Patching package to: $PACKAGE version: $VERSION cuda_major: $CUDA_MAJOR"
          sed -i "s/^name = \"moreau-cuda\"/name = \"$PACKAGE\"/" packages/moreau-cuda/pyproject.toml
          sed -i "s/nvidia-cudss-cu12/nvidia-cudss-cu${CUDA_MAJOR}/g" packages/moreau-cuda/pyproject.toml
          sed -i "s/==12\.\*/==${CUDA_MAJOR}.\*/g" packages/moreau-cuda/pyproject.toml
          cat packages/moreau-cuda/pyproject.toml

      - name: Build GPU wheel in Docker
        run: |
          echo "Building GPU wheel for CUDA ${{ matrix.cuda_version }} (${{ matrix.cuda_short }}) on ${{ matrix.arch }}..."

          mkdir -p dist

          DOCKER_BUILDKIT=1 docker build \
            --build-arg ARCH=${{ matrix.arch }} \
            --build-arg CUDA_ARCH_LABEL=${{ matrix.cuda_arch_label }} \
            --build-arg CUDSS_VERSION=${{ env.CUDSS_VERSION }} \
            --build-arg CUDA_VERSION=${{ matrix.cuda_version }} \
            --build-arg CUDA_SHORT=${{ matrix.cuda_short }} \
            --build-arg CUDA_MAJOR=${{ matrix.cuda_major }} \
            --build-arg CUDSS_SUFFIX=${{ matrix.cudss_suffix }} \
            --build-arg PYTORCH_INDEX=${{ matrix.pytorch_index }} \
            --build-arg GCC_TOOLSET=${{ matrix.gcc_toolset }} \
            -f packages/moreau-cuda/Dockerfile.wheel \
            --target wheel-out \
            --output type=local,dest=dist \
            .

          echo "Built GPU wheel:"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-gpu-${{ matrix.cuda_short }}-${{ matrix.arch }}
          path: dist/*.whl
          retention-days: 1

  # Pure Python wrapper wheel (moreau package)
  build-wrapper:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - name: Build wheel
        run: |
          pip install build
          cd packages/moreau
          python -m build --wheel
          python scripts/scrub_python_wheel.py dist/*.whl
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-wrapper
          path: packages/moreau/dist/*.whl
          retention-days: 1

  # ===========================================================================
  # C API libraries
  # ===========================================================================

  # CPU C library: Linux x86_64 + aarch64 (manylinux_2_28, cargo --features c-api)
  build-c-lib-cpu-linux:
    needs: [resolve-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - name: Build CPU C API in manylinux container
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -e MOREAU_OUT_DIR=/workspace/dist/c-api \
            -w /workspace \
            "quay.io/pypa/manylinux_2_28_${ARCH}" \
            bash -c '
              set -e
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env
              packages/moreau-c/build.sh cpu
              chmod -R 777 dist/
            '

          # Scrub build paths from binary
          python3 packages/moreau-cpu/scripts/scrub_binary.py dist/c-api/lib/libmoreau_cpu.so

          # Package as tarball (Julia Artifacts expects lib/ inside)
          tar czf "moreau-cpu-linux-${ARCH}.tar.gz" -C dist/c-api lib/libmoreau_cpu.so include LICENSE NOTICE

      - uses: actions/upload-artifact@v4
        with:
          name: c-lib-cpu-linux-${{ matrix.arch }}
          path: moreau-cpu-linux-${{ matrix.arch }}.tar.gz
          retention-days: 7

  # CPU C library: macOS ARM64
  build-c-lib-cpu-macos:
    needs: [resolve-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Set release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - name: Build CPU C API
        run: packages/moreau-c/build.sh cpu

      - name: Scrub and package
        run: |
          python3 packages/moreau-cpu/scripts/scrub_binary.py dist/c-api/lib/libmoreau_cpu.dylib
          tar czf moreau-cpu-macos-arm64.tar.gz -C dist/c-api lib/libmoreau_cpu.dylib include LICENSE NOTICE

      - uses: actions/upload-artifact@v4
        with:
          name: c-lib-cpu-macos-arm64
          path: moreau-cpu-macos-arm64.tar.gz
          retention-days: 7

  # CUDA C libraries: Linux x86_64 + aarch64 (Docker, per CUDA version).
  # aarch64 CUDA_ARCHITECTURES targets ARM server/embedded GPUs: sm_87 (Orin),
  # sm_90 (Grace Hopper), sm_120 (Blackwell, CUDA 13+). sm_75/80/86/89 are Turing/
  # Ampere/Ada desktop-x86 parts with no ARM-host equivalent.
  build-c-lib-cuda:
    needs: [resolve-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: "12.2"
            cuda_label: "cuda12"
            cuda_major: "12"
            cudss_suffix: "cuda12"
            gcc_toolset: "12"
            cuda_architectures: "75;80;86;89;90"
            arch: "x86_64"
            cuda_arch_label: "x86_64"
            runner: ubuntu-latest
          - cuda_version: "12.2"
            cuda_label: "cuda12"
            cuda_major: "12"
            cudss_suffix: "cuda12"
            gcc_toolset: "12"
            cuda_architectures: "87;90"
            arch: "aarch64"
            cuda_arch_label: "sbsa"
            runner: ubuntu-24.04-arm
          - cuda_version: "13.0"
            cuda_label: "cuda13"
            cuda_major: "13"
            cudss_suffix: "cuda13"
            gcc_toolset: "13"
            cuda_architectures: "75;80;86;89;90;120"
            arch: "x86_64"
            cuda_arch_label: "x86_64"
            runner: ubuntu-latest
          - cuda_version: "13.0"
            cuda_label: "cuda13"
            cuda_major: "13"
            cudss_suffix: "cuda13"
            gcc_toolset: "13"
            cuda_architectures: "87;90;120"
            arch: "aarch64"
            cuda_arch_label: "sbsa"
            runner: ubuntu-24.04-arm

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Set release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - name: Build CUDA C API in Docker
        env:
          CUDSS_VER: ${{ env.CUDSS_VERSION }}
          CUDA_VER: ${{ matrix.cuda_version }}
          CUDA_MAJ: ${{ matrix.cuda_major }}
          CUDSS_SUF: ${{ matrix.cudss_suffix }}
          GCC_TS: ${{ matrix.gcc_toolset }}
          CUDA_ARCHS: ${{ matrix.cuda_architectures }}
          CUDA_LABEL: ${{ matrix.cuda_label }}
          ARCH: ${{ matrix.arch }}
          CUDA_ARCH_LABEL: ${{ matrix.cuda_arch_label }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --build-arg ARCH="$ARCH" \
            --build-arg CUDA_ARCH_LABEL="$CUDA_ARCH_LABEL" \
            --build-arg CUDSS_VERSION="$CUDSS_VER" \
            --build-arg CUDA_VERSION="$CUDA_VER" \
            --build-arg CUDA_MAJOR="$CUDA_MAJ" \
            --build-arg CUDSS_SUFFIX="$CUDSS_SUF" \
            --build-arg GCC_TOOLSET="$GCC_TS" \
            --build-arg CUDA_ARCHITECTURES="$CUDA_ARCHS" \
            -f packages/moreau-cuda/Dockerfile.c-lib \
            --target output \
            --output type=local,dest=staging \
            .

          # Scrub build paths from binary (writes through symlink to the real .so)
          python3 packages/moreau-cuda/scripts/scrub_binary.py staging/lib/libmoreau_cuda.so

          # Package entire lib/ dir so the real .so.X.Y.Z file and soname
          # symlinks (libmoreau_cuda.so -> .so.0 -> .so.X.Y.Z) are all included.
          tar czf "moreau-${CUDA_LABEL}-linux-${ARCH}.tar.gz" -C staging lib/ include/ LICENSE NOTICE

      - uses: actions/upload-artifact@v4
        with:
          name: c-lib-${{ matrix.cuda_label }}-linux-${{ matrix.arch }}
          path: moreau-${{ matrix.cuda_label }}-linux-${{ matrix.arch }}.tar.gz
          retention-days: 7

  # ===========================================================================
  # GitHub Release
  # ===========================================================================
  github-release:
    needs:
      - resolve-version
      - build-cpu-wheel-linux
      - build-cpu-wheel-macos
      - build-gpu-wheel
      - build-wrapper
      - build-c-lib-cpu-linux
      - build-c-lib-cpu-macos
      - build-c-lib-cuda
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.name }}
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      # Download all artifacts
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Download all C library artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-clibs
          pattern: c-lib-*
          merge-multiple: true

      - name: Validate wheels and C libraries
        run: |
          for whl in dist-wheels/*.whl; do
            echo "Validating: $whl"
            python3 -c "import zipfile; assert zipfile.ZipFile('$whl').testzip() is None; print('ZIP OK')"
            python3 -c "import zipfile, sys; z=zipfile.ZipFile('$whl'); m=[n for n in z.namelist() if n.endswith('/METADATA')]; sys.exit(1) if not m else print('METADATA OK:', m[0])"
            sha256sum "$whl"
          done
          python3 scripts/validate_release_wheels.py dist-wheels --require-complete --c-library-dir dist-clibs

          echo "=== C library tarballs ==="
          for tb in dist-clibs/*.tar.gz; do
            echo "Validating: $tb"
            tar tzf "$tb"
            sha256sum "$tb"
          done

      - name: Set release name
        id: release
        env:
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          if [ -n "$INPUT_RELEASE_NAME" ]; then
            echo "name=$INPUT_RELEASE_NAME" >> $GITHUB_OUTPUT
          else
            echo "name=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi
          echo "Release name: $(grep name= $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Set up Julia for artifact manifest
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Generate Julia artifact manifest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.name }}
        run: |
          julia packages/moreau-julia/Moreau.jl/scripts/generate_artifacts.jl \
            "$RELEASE_TAG" dist-clibs
          cp packages/moreau-julia/Moreau.jl/Artifacts.toml \
            moreau-julia-Artifacts.toml

      - name: Package Julia source tarball
        run: |
          tar czf moreau-julia-src.tar.gz \
            --exclude='Moreau.jl/Manifest.toml' \
            -C packages/moreau-julia \
            Moreau.jl
          echo "Julia source tarball:"
          tar tzf moreau-julia-src.tar.gz | head -20
          du -h moreau-julia-src.tar.gz

      - name: Collect all release assets
        run: |
          mkdir -p dist-release
          cp dist-wheels/*.whl dist-release/
          cp dist-clibs/*.tar.gz dist-release/
          cp moreau-julia-Artifacts.toml dist-release/
          cp moreau-julia-src.tar.gz dist-release/
          echo "=== Release assets ==="
          ls -la dist-release/
          du -h dist-release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.name }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist-release/*
          body: |
            ChatGPT generated:

            ## Release from commit ${{ github.sha }}

            ### Python Wheels

            | Package | Platform | Python | ABI |
            |---------|----------|--------|-----|
            | moreau | any | 3.9+ | py3-none-any |
            | moreau-cpu | Linux x86_64 | 3.9+ | abi3-py39 |
            | moreau-cpu | Linux aarch64 | 3.9+ | abi3-py39 |
            | moreau-cpu | macOS ARM64 | 3.9+ | abi3-py39 |
            | moreau-cuda12 | Linux x86_64 | 3.12+ | abi3-py312 |
            | moreau-cuda12 | Linux aarch64 | 3.12+ | abi3-py312 |
            | moreau-cuda13 | Linux x86_64 | 3.12+ | abi3-py312 |
            | moreau-cuda13 | Linux aarch64 | 3.12+ | abi3-py312 |

            ```bash
            # CPU only
            pip install moreau-*.whl moreau_cpu-*.whl

            # GPU (CUDA 12.2+)
            pip install moreau-*.whl moreau_cpu-*.whl moreau_cuda12-*.whl
            ```

            Linux aarch64 CUDA wheels target Grace Hopper (sm_90), Orin
            (sm_87), and Blackwell sm_120 on CUDA 13. They are build-validated
            only; run `python -m moreau check` after install to verify.

            ### C API Libraries (tarballs)

            | Tarball | Platform | Backend |
            |---------|----------|---------|
            | `moreau-cpu-linux-x86_64.tar.gz` | Linux x86_64 | CPU |
            | `moreau-cpu-linux-aarch64.tar.gz` | Linux aarch64 | CPU |
            | `moreau-cpu-macos-arm64.tar.gz` | macOS ARM64 | CPU |
            | `moreau-cuda12-linux-x86_64.tar.gz` | Linux x86_64 | CUDA 12 |
            | `moreau-cuda12-linux-aarch64.tar.gz` | Linux aarch64 | CUDA 12 |
            | `moreau-cuda13-linux-x86_64.tar.gz` | Linux x86_64 | CUDA 13 |
            | `moreau-cuda13-linux-aarch64.tar.gz` | Linux aarch64 | CUDA 13 |

            Each tarball contains the shared library, `include/moreau.h`, `LICENSE`, and `NOTICE`.

          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger test-release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.name }}
        run: |
          echo "Triggering test-release for tag: $RELEASE_TAG"
          gh workflow run test-release.yml --ref "$RELEASE_TAG" -f "release_tag=$RELEASE_TAG"
