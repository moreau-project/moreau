# Build all artifacts and create a GitHub Release for QA.
#
# Stable release pipeline (see RELEASE.md):
#   release.yml -> julia-release.yml prepare-jll-prs -> manual Yggdrasil PRs/registration
#   -> julia-release.yml test -> test-release.yml -> julia-release.yml prepare-registration
#   -> manual Registrator comment / General registration -> publish.yml.
# Development/prerelease builds go directly to test-release.yml.
#
# Usage:
#   gh workflow run release.yml
#   gh workflow run release.yml -f version=0.4.0 -f release_name=v0.4.0

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact package version (e.g., 0.4.0). Leave empty for a timestamped dev version.'
        required: false
        type: string
      release_name:
        description: 'GitHub release/tag (e.g., v0.4.0). Leave empty for dev-YYYYMMDD-HHMMSS.'
        required: false
        type: string

env:
  CUDSS_VERSION: "0.7.1.4"

jobs:
  # ===========================================================================
  # Resolve version from input or pyproject.toml
  # ===========================================================================
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            BASE=$(grep '^version = ' packages/moreau/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
            VERSION="${BASE}.dev$(date -u +%Y%m%d%H%M%S)"
          fi
          python3 scripts/bump_version.py "$VERSION" --pin-dependencies
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git diff --exit-code
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

  # ===========================================================================
  # Python wheels
  # ===========================================================================

  # CPU wheel: Linux x86_64 + aarch64 (manylinux_2_28, Rust/maturin, abi3-py39)
  build-cpu-wheel-linux:
    needs: [resolve-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - name: Build CPU wheel in manylinux container
        env:
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          docker run --rm \
            -e RUST_TARGET \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/packages/moreau-cpu \
            "quay.io/pypa/manylinux_2_28_${ARCH}" \
            bash -c '
              set -e
              # Install Rust
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env

              # Install maturin using manylinux Python 3.12
              /opt/python/cp312-cp312/bin/pip install maturin

              # Build wheel (manylinux tag is automatic inside manylinux container)
              /opt/python/cp312-cp312/bin/maturin build --release --target "$RUST_TARGET"

              echo "Built wheel:"
              ls -la target/wheels/

              # Scrub binary strings (must run inside container to have write permission)
              /opt/python/cp312-cp312/bin/python scripts/scrub_binary.py target/wheels/*.whl
              # Strip Python comments from .py files in the wheel
              /opt/python/cp312-cp312/bin/python /workspace/packages/moreau/scripts/scrub_python_wheel.py target/wheels/*.whl
              echo "Wheel scrubbed successfully"

              # Fix permissions for artifacts
              chmod -R 777 target/wheels
            '

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-cpu-linux-${{ matrix.arch }}
          path: packages/moreau-cpu/target/wheels/*.whl
          retention-days: 1

  # CPU wheel: macOS ARM64 (Apple Silicon, native build)
  build-cpu-wheel-macos:
    needs: [resolve-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - uses: dtolnay/rust-toolchain@stable

      - name: Build CPU wheel
        run: |
          pip install maturin
          cd packages/moreau-cpu
          maturin build --release

      - name: Scrub binary and strip comments
        run: |
          python3 packages/moreau-cpu/scripts/scrub_binary.py packages/moreau-cpu/target/wheels/*.whl
          python3 packages/moreau/scripts/scrub_python_wheel.py packages/moreau-cpu/target/wheels/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-cpu-macos
          path: packages/moreau-cpu/target/wheels/*.whl
          retention-days: 1

  # GPU wheels: CUDA 12.2 and 13.0 × {x86_64, aarch64} (Docker, nanobind abi3-py312).
  # CUDA_ARCHITECTURES drops sm_75 on aarch64 (no Turing on ARM
  # server SoCs) and adds sm_87 for Jetson Orin.
  build-gpu-wheel:
    needs: [resolve-version]
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_version: "12.2"
            cuda_short: "cu122"
            cuda_major: "12"
            cudss_suffix: "cuda12"
            gcc_toolset: "12"
            package_name: "moreau-cuda12"
            arch: "x86_64"
            cuda_arch_label: "x86_64"
            runner: ubuntu-latest
          - cuda_version: "12.2"
            cuda_short: "cu122"
            cuda_major: "12"
            cudss_suffix: "cuda12"
            gcc_toolset: "12"
            package_name: "moreau-cuda12"
            arch: "aarch64"
            cuda_arch_label: "sbsa"
            runner: ubuntu-24.04-arm
          - cuda_version: "13.0"
            cuda_short: "cu130"
            cuda_major: "13"
            cudss_suffix: "cuda13"
            gcc_toolset: "13"
            package_name: "moreau-cuda13"
            arch: "x86_64"
            cuda_arch_label: "x86_64"
            runner: ubuntu-latest
          - cuda_version: "13.0"
            cuda_short: "cu130"
            cuda_major: "13"
            cudss_suffix: "cuda13"
            gcc_toolset: "13"
            package_name: "moreau-cuda13"
            arch: "aarch64"
            cuda_arch_label: "sbsa"
            runner: ubuntu-24.04-arm

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v7

      - name: Patch version and package name in pyproject.toml
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          PACKAGE: ${{ matrix.package_name }}
          CUDA_MAJOR: ${{ matrix.cuda_major }}
        run: |
          python3 scripts/bump_version.py "$VERSION" --pin-dependencies
          echo "Patching package to: $PACKAGE version: $VERSION cuda_major: $CUDA_MAJOR"
          sed -i "s/^name = \"moreau-cuda\"/name = \"$PACKAGE\"/" packages/moreau-cuda/pyproject.toml
          sed -i "s/nvidia-cudss-cu12/nvidia-cudss-cu${CUDA_MAJOR}/g" packages/moreau-cuda/pyproject.toml
          sed -i "s/==12\.\*/==${CUDA_MAJOR}.\*/g" packages/moreau-cuda/pyproject.toml
          cat packages/moreau-cuda/pyproject.toml

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the build cache registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build GPU wheel in Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/moreau-cuda/Dockerfile.wheel
          target: wheel-out
          outputs: type=local,dest=dist
          build-args: |
            ARCH=${{ matrix.arch }}
            CUDA_ARCH_LABEL=${{ matrix.cuda_arch_label }}
            CUDSS_VERSION=${{ env.CUDSS_VERSION }}
            CUDA_VERSION=${{ matrix.cuda_version }}
            CUDSS_SUFFIX=${{ matrix.cudss_suffix }}
            GCC_TOOLSET=${{ matrix.gcc_toolset }}
          # Registry caches survive infrequent releases. Each platform writes its own tag.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/wheel-cache:${{ matrix.cuda_short }}-${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/wheel-cache:${{ matrix.cuda_short }}-${{ matrix.arch }},mode=max

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-gpu-${{ matrix.cuda_short }}-${{ matrix.arch }}
          path: dist/*.whl
          retention-days: 1

  # Pure Python wrapper wheel (moreau package)
  build-wrapper:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - name: Build wheel
        run: |
          pip install build
          cd packages/moreau
          python -m build --wheel
          python scripts/scrub_python_wheel.py dist/*.whl
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-wrapper
          path: packages/moreau/dist/*.whl
          retention-days: 1

  # ===========================================================================
  # GitHub Release
  # ===========================================================================
  github-release:
    needs:
      - resolve-version
      - build-cpu-wheel-linux
      - build-cpu-wheel-macos
      - build-gpu-wheel
      - build-wrapper
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.name }}
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v7

      # Download all artifacts
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-wheels
          pattern: wheel-*
          merge-multiple: true

      - name: Validate wheels
        run: python3 scripts/validate_release_wheels.py dist-wheels --require-complete

      - name: Set release name
        id: release
        env:
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          if [ -n "$INPUT_RELEASE_NAME" ]; then
            echo "name=$INPUT_RELEASE_NAME" >> $GITHUB_OUTPUT
          else
            echo "name=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi
          echo "Release name: $(grep name= $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Set Julia source release version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: python3 scripts/bump_version.py "$VERSION" --pin-dependencies

      - name: Package Julia source tarball
        run: |
          git -C packages/moreau-julia ls-files -z Moreau.jl | \
            tar --null -czf moreau-julia-src.tar.gz -C packages/moreau-julia -T -
          echo "Julia source tarball:"
          tar tzf moreau-julia-src.tar.gz | head -20
          du -h moreau-julia-src.tar.gz

      - name: Collect all release assets
        run: |
          mkdir -p dist-release
          cp dist-wheels/*.whl dist-release/
          cp moreau-julia-src.tar.gz dist-release/
          echo "=== Release assets ==="
          ls -la dist-release/
          du -h dist-release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.name }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist-release/*
          body: |
            ChatGPT generated:

            ## Release from commit ${{ github.sha }}

            ### Python Wheels

            | Package | Platform | Python | ABI |
            |---------|----------|--------|-----|
            | moreau | any | 3.9+ | py3-none-any |
            | moreau-cpu | Linux x86_64 | 3.9+ | abi3-py39 |
            | moreau-cpu | Linux aarch64 | 3.9+ | abi3-py39 |
            | moreau-cpu | macOS ARM64 | 3.9+ | abi3-py39 |
            | moreau-cuda12 | Linux x86_64 | 3.12+ | abi3-py312 |
            | moreau-cuda12 | Linux aarch64 | 3.12+ | abi3-py312 |
            | moreau-cuda13 | Linux x86_64 | 3.12+ | abi3-py312 |
            | moreau-cuda13 | Linux aarch64 | 3.12+ | abi3-py312 |

            ```bash
            # CPU only
            pip install moreau-*.whl moreau_cpu-*.whl

            # GPU (CUDA 12.2+)
            pip install moreau-*.whl moreau_cpu-*.whl moreau_cuda12-*.whl
            ```

            Linux aarch64 CUDA wheels target Grace Hopper (sm_90), Orin
            (sm_87), and Blackwell sm_120 on CUDA 13. They are build-validated
            only; run `python -m moreau check` after install to verify.

            ### C/C++ source builds

            Build the C API with your local toolchain from a source checkout:
            `packages/moreau-c/build.sh cpu` or `packages/moreau-c/build.sh cuda`.
            The output in `dist/c-api/` contains the library, header, and licenses.

            CUDA artifacts are built and validated on CPU runners. CUDA runtime
            testing is opt-in while GPU runners are unavailable; the release QA
            summary records whether it ran.

          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the next release stage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.name }}
          RUN_GPU_TESTS: ${{ vars.MOREAU_GPU_RUNNERS_ENABLED == 'true' }}
          STABLE: ${{ needs.resolve-version.outputs.stable }}
        run: |
          if [ "$STABLE" = true ]; then
            gh workflow run julia-release.yml --ref "$RELEASE_TAG" \
              -f "release_tag=$RELEASE_TAG" -f stage=prepare-jll-prs
            echo 'JLL branch preparation dispatched. Open the upstream PRs using its summary links. After both JLLs register, run Julia Release with stage=test.' >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run test-release.yml --ref "$RELEASE_TAG" \
              -f "release_tag=$RELEASE_TAG" -f "run_gpu_tests=$RUN_GPU_TESTS"
          fi
