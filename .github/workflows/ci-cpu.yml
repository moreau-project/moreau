name: CI (CPU)

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/moreau-cpu/**'
      - 'packages/moreau/**'
      - '.github/workflows/ci-cpu.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - 'packages/moreau-cpu/**'
      - 'packages/moreau/**'
      - '.github/workflows/ci-cpu.yml'
      - 'scripts/**'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-active-set:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install native test dependencies
      run: sudo apt-get update && sudo apt-get install -y cmake libgtest-dev
    - name: Build native active-set tests
      run: |
        cmake -S packages/moreau-cpu/cpp -B build/active-set -DCMAKE_BUILD_TYPE=Release -DMOREAU_BUILD_TESTS=ON
        cmake --build build/active-set --target test_active_set --parallel 2
    - name: Run native active-set tests
      run: ctest --test-dir build/active-set --output-on-failure --no-tests=error

  test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: '**/pyproject.toml'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt

    - name: Check formatting
      working-directory: packages/moreau-cpu
      run: cargo fmt --check

    - name: Cache Rust build
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          packages/moreau-cpu/target
        key: rust-${{ runner.os }}-${{ hashFiles('packages/moreau-cpu/Cargo.lock') }}
        restore-keys: |
          rust-${{ runner.os }}-

    - name: Install maturin
      run: pip install maturin

    - name: Build and install CPU package
      working-directory: packages/moreau-cpu
      run: |
        rm -f target/wheels/*.whl
        maturin build --release
        pip install target/wheels/*.whl

    - name: Install wrapper package and test dependencies
      run: |
        pip install -e packages/moreau
        pip install pytest numpy scipy hypothesis
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install jax
        source scripts/ci_upstream.sh
        pip install "cvxpy==$UPSTREAM_CVXPY_VERSION" "cvxpylayers==$UPSTREAM_CVXPYLAYERS_VERSION"

    - name: Test import
      run: |
        python -c "import moreau; print(f'Version: {moreau.__version__}')"
        python -c "from moreau import Cones, Solver; print('Imports OK')"

    - name: Test release tooling
      run: pytest scripts/tests/ -q

    - name: Clone upstream test repos
      run: |
        source scripts/ci_upstream.sh
        prepare_upstream_tests /tmp/moreau-upstream python

    - name: Run moreau tests
      id: moreau_tests
      run: pytest packages/moreau/tests/python/ -v --tb=short --device=cpu -rs

    - name: Run moreau-cpu tests
      if: always()
      run: pytest packages/moreau-cpu/tests/python/ -v --tb=short

    - name: Run cvxpy Moreau tests
      if: always()
      run: python -m pytest /tmp/moreau-upstream/cvxpy-tests/test_conic_solvers.py -v --tb=short -k "Moreau"

    - name: Run cvxpylayers Moreau tests
      if: always()
      run: |
        source scripts/ci_upstream.sh
        run_cvxpylayers_tests /tmp/moreau-upstream python -k "not cuda"
