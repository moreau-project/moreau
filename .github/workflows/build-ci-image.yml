name: Build CI Docker Image

on:
  workflow_dispatch:  # Manual trigger only

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cuda-ci

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    # Free up disk space - CUDA image is ~10GB and runner has limited space
    - name: Free disk space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: false  # Keep tool cache for faster builds
        android: true      # Free ~9GB
        dotnet: true       # Free ~2GB
        haskell: true      # Free ~5GB
        large-packages: true  # Free additional space
        swap-storage: false   # Keep swap
        docker-images: false  # We need Docker

    - uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .github/docker
        file: .github/docker/Dockerfile.cuda-ci
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
