# Test wheels from a GitHub Release.
#
# Run this after release.yml creates a GitHub Release to validate the artifacts.
# Can be re-triggered for the same release tag.
#
# Usage:
#   gh workflow run test-release.yml --ref main -f release_tag=v0.4.0
#   gh workflow run test-release.yml -f release_tag=dev-20260313-120000
# Add -f run_gpu_tests=true when GPU runners are available.

name: Test Release
run-name: Test Release ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to test (e.g., v0.4.0 or dev-20260313-120000)'
        required: true
        type: string
      run_gpu_tests:
        description: 'Run CUDA 12/13 runtime tests (requires GPU runners)'
        type: boolean
        default: false

jobs:
  test-gpu:
    if: inputs.run_gpu_tests
    permissions:
      contents: read
      actions: read
      statuses: write
    uses: ./.github/workflows/test-gpu-wheels.yml
    with:
      release_tag: ${{ inputs.release_tag }}

  qa-coverage:
    name: QA coverage
    if: always()
    needs: [test-gpu, test-cpu-macos, test-cpu-linux, julia-release-info, test-julia, test-julia-native]
    runs-on: ubuntu-latest
    steps:
      - name: Record tested platforms
        env:
          GPU_REQUESTED: ${{ inputs.run_gpu_tests }}
          GPU_RESULT: ${{ needs.test-gpu.result }}
          MACOS_RESULT: ${{ needs.test-cpu-macos.result }}
          LINUX_RESULT: ${{ needs.test-cpu-linux.result }}
          JULIA_RESULT: ${{ needs.test-julia.result }}
          JULIA_NATIVE_RESULT: ${{ needs.test-julia-native.result }}
        run: |
          echo "| Validation | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Linux CPU wheels | $LINUX_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| macOS CPU wheels | $MACOS_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Julia registered JLL matrix | $JULIA_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Julia prerelease native CPU | $JULIA_NATIVE_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GPU_REQUESTED" = "true" ]; then
            echo "| CUDA 12/13 runtime | $GPU_RESULT |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| CUDA 12/13 runtime | Not run (GPU testing not requested) |" >> "$GITHUB_STEP_SUMMARY"
          fi

  # macOS CPU tests
  test-cpu-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p dist-cpu dist-wrapper
          gh release download "$RELEASE_TAG" --dir dist-all

          for whl in dist-all/*.whl; do
            name="$(basename "$whl")"
            case "$name" in
              moreau_cpu-*macosx*) cp "$whl" dist-cpu/ ;;
              moreau-*)            cp "$whl" dist-wrapper/ ;;
            esac
          done

          echo "=== CPU wheels ===" && ls -la dist-cpu/
          echo "=== Wrapper wheels ===" && ls -la dist-wrapper/

      - name: Set up Python 3.9, 3.13, and 3.14 for abi3 tests
        uses: actions/setup-python@v7
        with:
          python-version: |
            3.9
            3.13
            3.14

      - name: Test abi3 wheel import on Python 3.9, 3.13, and 3.14
        run: |
          echo "=== Testing abi3 wheel import on Python 3.9, 3.13, and 3.14 ==="
          for PYVER in 3.9 3.13 3.14; do
            echo "--- Python ${PYVER} ---"
            "python${PYVER}" -m venv /tmp/test_env_${PYVER}
            /tmp/test_env_${PYVER}/bin/pip install --upgrade pip -q
            /tmp/test_env_${PYVER}/bin/pip install numpy scipy -q
            /tmp/test_env_${PYVER}/bin/pip install --no-deps dist-cpu/*.whl -q
            /tmp/test_env_${PYVER}/bin/python -c "import moreau_cpu._cpu_solver as mc; print(f'Python ${PYVER}: CPU native extension OK: {mc}')"
            echo "Python ${PYVER}: abi3 import test passed"
            rm -rf /tmp/test_env_${PYVER}
          done

      - name: Install and test (Python 3.12)
        run: |
          python3.12 -m venv /tmp/test_env_main
          /tmp/test_env_main/bin/pip install --upgrade pip
          /tmp/test_env_main/bin/pip install dist-cpu/*.whl dist-wrapper/*.whl
          /tmp/test_env_main/bin/python -c "import moreau; print('moreau OK:', moreau.__file__)"
          /tmp/test_env_main/bin/pip install pytest numpy scipy hypothesis cvxpy clarabel
          /tmp/test_env_main/bin/pytest packages/moreau/tests/python/ -v --tb=short

  # Validate both Linux CPU architectures without depending on GPU runners.
  test-cpu-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            python: '3.9'
          - arch: x86_64
            runner: ubuntu-latest
            python: '3.12'
          - arch: x86_64
            runner: ubuntu-latest
            python: '3.14'
          - arch: aarch64
            runner: ubuntu-24.04-arm
            python: '3.12'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Download CPU release wheels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern "moreau_cpu-*manylinux*${ARCH}.whl" \
            --pattern 'moreau-*-py3-none-any.whl'

      - name: Install and smoke-test release wheels
        run: |
          pip install dist/*.whl pytest
          pytest packages/moreau/tests/python/test_direct_cone_forward.py \
            packages/moreau/tests/python/test_direct_cone_validation.py \
            packages/moreau-cpu/tests/python/test_direct_cone_python_binding.py \
            --device=cpu -v --tb=short -rs

      - name: Run full CPU suite
        if: matrix.python == '3.12'
        run: |
          pip install pytest numpy scipy hypothesis cvxpy clarabel
          pytest packages/moreau/tests/python/ packages/moreau-cpu/tests/python/ \
            --device=cpu -v --tb=short -rs

  julia-release-info:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read and validate released Julia source
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern moreau-julia-src.tar.gz --dir julia-assets
          python - <<'PYINFO'
          import os, re, tarfile, tomllib
          with tarfile.open("julia-assets/moreau-julia-src.tar.gz") as archive:
              version = tomllib.loads(archive.extractfile("Moreau.jl/Project.toml").read().decode())["version"]
          stable = bool(re.fullmatch(r"\d+\.\d+\.\d+", version))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"stable={str(stable).lower()}\n")
          PYINFO
      - name: Require exact tagged Julia source for stable releases
        if: steps.version.outputs.stable == 'true'
        run: bash scripts/check_julia_source.sh julia-assets/moreau-julia-src.tar.gz
      - uses: actions/checkout@v7
        if: steps.version.outputs.stable == 'true'
        with:
          repository: JuliaRegistries/General
          path: general-registry
          sparse-checkout: |
            jll/M/Moreau_CPU_jll
            jll/M/Moreau_CUDA_jll
      - name: Require registered release dependencies
        if: steps.version.outputs.stable == 'true'
        run: python scripts/check_julia_registry.py general-registry

  test-julia:
    needs: julia-release-info
    if: needs.julia-release-info.outputs.stable == 'true'
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/julia.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      run_gpu_tests: ${{ inputs.run_gpu_tests }}

  # Prereleases build their native dependency from the release commit; shims
  # avoid trying to register development versions in General.
  test-julia-native:
    needs: julia-release-info
    if: needs.julia-release-info.outputs.stable != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern moreau-julia-src.tar.gz --dir dist-all

          echo "=== Release assets ==="
          ls -la dist-all/

      - name: Extract Julia source
        run: |
          # Extract Julia source tarball
          mkdir -p julia-src
          tar xzf dist-all/moreau-julia-src.tar.gz -C julia-src
          echo "=== Julia source ==="
          find julia-src -type f | head -30

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Prepare prerelease native dependency
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("julia-src/Moreau.jl/Project.toml", "rb"))["version"].replace("-dev", ".dev"))')
          python scripts/bump_version.py "$VERSION" --pin-dependencies
          cargo build --manifest-path packages/moreau-cpu/Cargo.toml --locked --release --lib --features c-api
          julia scripts/julia_native_fixture.jl julia-src/Moreau.jl \
            native-qa/Moreau_CPU_jll packages/moreau-cpu/target/release/libmoreau.so

      - name: Run Julia tests
        run: |
          # Check the native build and released Julia package have the same version.
          julia --project=julia-src/Moreau.jl -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.develop(path="native-qa/Moreau_CPU_jll")
            Pkg.resolve()
            Pkg.test(julia_args=["--compile=min"])
          '

          # Use the same released package for the internal integration tests.
          julia --project=packages/moreau-julia/MoreauTests.jl -e '
            using Pkg
            Pkg.develop([PackageSpec(path="julia-src/Moreau.jl"), PackageSpec(path="native-qa/Moreau_CPU_jll")])
            Pkg.resolve()
            Pkg.test(julia_args=["--compile=min"])
          '
