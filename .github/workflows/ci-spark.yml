name: CI (DGX Spark)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: [self-hosted, spark-gb10]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Inspect task limits and CPU solver thread pools
        shell: bash -l -eo pipefail {0}
        run: |
          printf 'Runner: %s\n' "$RUNNER_NAME"
          for file in pids.max pids.current pids.peak pids.events memory.max memory.current memory.events; do
            if [ -r "/sys/fs/cgroup/$file" ]; then
              printf '%s: ' "$file"
              cat "/sys/fs/cgroup/$file"
            fi
          done
          printf 'Process limit: '
          ulimit -u
          ps -eLo pid,nlwp,comm --sort=-nlwp | sed -n '1,12p'
          python="$(dirname "$GITHUB_WORKSPACE")/spark-ci-work/venv/bin/python"
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 "$python" - <<'PY'
          import gc
          import os
          import time
          from pathlib import Path
          import moreau

          def snapshot(label):
              tasks = Path('/sys/fs/cgroup/pids.current').read_text().strip()
              print(label, 'process_threads=', len(os.listdir('/proc/self/task')),
                    'container_tasks=', tasks, flush=True)

          snapshot('before')
          solvers = []
          for i in range(6):
              solvers.append(moreau.CompiledSolver(
                  n=1, m=1, P_row_offsets=[0,1], P_col_indices=[0],
                  A_row_offsets=[0,1], A_col_indices=[0],
                  cones=moreau.Cones(num_nonneg_cones=1),
                  settings=moreau.Settings(device='cpu', batch_size=2)))
              snapshot(f'{i+1} solvers')
          solvers.clear()
          gc.collect()
          time.sleep(0.1)
          snapshot('released')
          PY
      - name: Measure one upstream test job in isolation
        shell: bash -l -eo pipefail {0}
        env:
          XLA_PYTHON_CLIENT_PREALLOCATE: 'false'
        run: |
          python="$(dirname "$GITHUB_WORKSPACE")/spark-ci-work/venv/bin/python"
          "$python" - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import time

          cgroup = Path('/sys/fs/cgroup')
          def denials():
              return int(dict(line.split() for line in (cgroup/'pids.events').read_text().splitlines())['max'])

          before = denials()
          peak = 0
          work = str(Path(os.environ['GITHUB_WORKSPACE']).parent / 'spark-ci-work')
          proc = subprocess.Popen(['scripts/ci_spark.sh', 'test-upstream', work])
          while proc.poll() is None:
              peak = max(peak, int((cgroup/'pids.current').read_text()))
              time.sleep(0.05)
          print(f'ISOLATED_SUITE peak_tasks={peak} denied_task_creations={denials()-before} exit_code={proc.returncode}', flush=True)
          raise SystemExit(proc.returncode)
          PY
