# Publish Python artifacts from a GitHub Release to PyPI.
#
# Run this AFTER creating a GitHub Release (via release.yml) and completing QA.
#
# Usage:
#   gh workflow run publish.yml -f release_tag=v0.2.0
#   gh workflow run publish.yml -f release_tag=dev-20260313-120000

name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to publish (e.g., v0.2.0 or dev-20260313-120000)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist

          echo "=== Release assets ==="
          ls -la dist/

      # Publish Python wheels to PyPI.
      - name: Separate wheels for PyPI
        run: |
          mkdir -p dist-pypi
          cp dist/*.whl dist-pypi/
          echo "=== Wheels for PyPI ==="
          ls -la dist-pypi/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/

  # Verify: install from PyPI and run tests
  verify-python:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # v0.2.1 -> 0.2.1, dev-20260313-120000 -> extract from wheel later
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for PyPI to index all packages at this version
        # The publish job's upload returns 200 OK before PyPI's simple index
        # has caught up, and propagation is uneven across packages: we've
        # seen two of four visible and two missing 11s after upload. Poll
        # each package with `pip install --dry-run` (the same resolver the
        # real install uses), exit the step as soon as PyPI agrees, and fail
        # the job if it isn't consistent within 5 minutes.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -u
          PKGS=(moreau moreau-cpu moreau-cuda12 moreau-cuda13)
          pip install --upgrade pip -q
          start=$(date +%s)
          for pkg in "${PKGS[@]}"; do
            for attempt in $(seq 1 30); do
              if pip install --dry-run --no-deps "${pkg}==${VERSION}" >/dev/null 2>&1; then
                elapsed=$(( $(date +%s) - start ))
                echo "  ${pkg} ${VERSION} visible (attempt ${attempt}, ${elapsed}s elapsed)"
                continue 2
              fi
              sleep 10
            done
            echo "::error::Timed out waiting for ${pkg} ${VERSION} to appear on PyPI"
            exit 1
          done

      - name: Install from PyPI and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install --upgrade pip
          pip install "moreau==$VERSION"
          python -c "import moreau; print('moreau OK:', moreau.__version__)"
          pip install pytest numpy scipy hypothesis cvxpy clarabel
          pytest packages/moreau/tests/python/ -v --tb=short

  # Fast-forward the `release` branch to the published tag so the out-of-band
  # docs build picks up the version users actually install from PyPI. Only
  # runs after PyPI verification succeeds, so docs never point at a broken
  # release. Uses a plain push (no --force); a non-fast-forward will
  # fail the job and require manual intervention.
  update-release-branch:
    needs: verify-python
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward release branch to tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Verify the tag exists and get its commit.
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "Fast-forwarding release -> ${RELEASE_TAG} (${TAG_COMMIT})"
          # Plain push (no --force): GitHub will reject a non-fast-forward.
          git push origin "${TAG_COMMIT}:refs/heads/release"
