# Publish artifacts from a GitHub Release to PyPI + update Julia packages.
#
# Run this AFTER creating a GitHub Release (via release.yml) and completing QA.
#
# Usage:
#   gh workflow run publish.yml -f release_tag=v0.2.0
#   gh workflow run publish.yml -f release_tag=dev-20260313-120000

name: Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to publish (e.g., v0.2.0 or dev-20260313-120000)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir dist

          echo "=== Release assets ==="
          ls -la dist/

          # Extract Julia source from release tarball
          mkdir -p julia-src
          tar xzf dist/moreau-julia-src.tar.gz -C julia-src
          echo ""
          echo "=== Julia source ==="
          find julia-src -type f | head -20

      - name: Extract version from wheel filenames
        id: version
        run: |
          # Extract version from wrapper wheel filename
          # e.g. moreau-0.2.0-py3-none-any.whl -> 0.2.0
          WHL="$(ls dist/moreau-[0-9]*.whl | head -1)"
          VERSION="$(basename "$WHL" | sed 's/^moreau-//; s/-py3-.*//')"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      # Generate Julia Artifacts.toml files using Julia's native download
      # mechanism. Each tarball contains lib/<library> and is hosted as a
      # GitHub Release asset on the public JLL repo.
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Generate Julia CPU Artifacts.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          julia -e '
            using Pkg.Artifacts, SHA, Pkg.TOML, Base.BinaryPlatforms

            version = ENV["VERSION"]
            artifacts_toml = "julia-src/Moreau_CPU_jll.jl/Artifacts.toml"
            jll_repo = "https://github.com/optimalintellect/Moreau_CPU_jll.jl/releases/download"

            isfile(artifacts_toml) && rm(artifacts_toml)

            platforms = [
              (arch="x86_64",  os="linux", tarball="moreau-cpu-linux-x86_64.tar.gz"),
              (arch="aarch64", os="linux", tarball="moreau-cpu-linux-aarch64.tar.gz"),
              (arch="aarch64", os="macos", tarball="moreau-cpu-macos-arm64.tar.gz"),
            ]

            for p in platforms
              local_tarball = joinpath("dist", p.tarball)

              if !isfile(local_tarball)
                @warn "Skipping $(p.tarball) — not found in dist/"
                continue
              end

              tarball_sha256 = bytes2hex(open(sha256, local_tarball))

              # Create artifact from tarball contents to get the git-tree-sha1
              hash = create_artifact() do dir
                run(`tar xzf $local_tarball -C $dir`)
              end

              download_url = "$(jll_repo)/v$(version)/$(p.tarball)"

              bind_artifact!(
                artifacts_toml, "moreau_cpu", hash;
                platform = Platform(p.arch, p.os),
                download_info = [(download_url, tarball_sha256)],
                force = true,
              )

              @info "Bound $(p.os)-$(p.arch)" git_tree_sha1=bytes2hex(hash.bytes) url=download_url
            end

            @info "Generated $(artifacts_toml)"
            println(read(artifacts_toml, String))
          '

      - name: Generate Julia CUDA Artifacts.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          julia -e '
            using Pkg.Artifacts, SHA, Pkg.TOML, Base.BinaryPlatforms

            version = ENV["VERSION"]
            artifacts_toml = "julia-src/Moreau_CUDA_jll.jl/Artifacts.toml"
            jll_repo = "https://github.com/optimalintellect/Moreau_CUDA_jll.jl/releases/download"

            isfile(artifacts_toml) && rm(artifacts_toml)

            cuda_variants = [
              (cuda_label="cuda12", arch="x86_64",  tarball="moreau-cuda12-linux-x86_64.tar.gz"),
              (cuda_label="cuda12", arch="aarch64", tarball="moreau-cuda12-linux-aarch64.tar.gz"),
              (cuda_label="cuda13", arch="x86_64",  tarball="moreau-cuda13-linux-x86_64.tar.gz"),
              (cuda_label="cuda13", arch="aarch64", tarball="moreau-cuda13-linux-aarch64.tar.gz"),
            ]

            for v in cuda_variants
              local_tarball = joinpath("dist", v.tarball)

              if !isfile(local_tarball)
                @warn "Skipping $(v.cuda_label)/$(v.arch) — $(v.tarball) not found in dist/"
                continue
              end

              tarball_sha256 = bytes2hex(open(sha256, local_tarball))
              artifact_name = "moreau_$(v.cuda_label)"

              hash = create_artifact() do dir
                run(`tar xzf $local_tarball -C $dir`)
              end

              download_url = "$(jll_repo)/v$(version)/$(v.tarball)"

              bind_artifact!(
                artifacts_toml, artifact_name, hash;
                platform = Platform(v.arch, "linux"),
                download_info = [(download_url, tarball_sha256)],
                force = true,
              )

              @info "Bound $(v.cuda_label)/$(v.arch)" git_tree_sha1=bytes2hex(hash.bytes) url=download_url
            end

            @info "Generated $(artifacts_toml)"
            println(read(artifacts_toml, String))
          '

      # Push Julia packages to their GitHub repos
      - name: Push Julia packages to GitHub repos
        env:
          JULIA_DEPLOY_TOKEN: ${{ secrets.JULIA_DEPLOY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          REPOS=("Moreau.jl" "Moreau_CPU_jll.jl" "Moreau_CUDA_jll.jl")
          SOURCES=("julia-src/Moreau.jl" "julia-src/Moreau_CPU_jll.jl" "julia-src/Moreau_CUDA_jll.jl")

          for i in "${!REPOS[@]}"; do
            REPO="${REPOS[$i]}"
            SRC="${SOURCES[$i]}"
            DEST="/tmp/julia-deploy/${REPO}"

            echo "=== Deploying ${REPO} ==="

            git clone "https://x-access-token:${JULIA_DEPLOY_TOKEN}@github.com/optimalintellect/${REPO}.git" "$DEST"

            rsync -av --delete --exclude='.git' "${SRC}/" "${DEST}/"

            cd "$DEST"
            git add -A
            if git diff --cached --quiet; then
              echo "No changes to ${REPO}"
            else
              git commit -m "Update ${REPO} for v${VERSION}"
              git push
              echo "Pushed ${REPO}"
            fi
            cd -
          done

      # Create GitHub Releases on the public JLL repos with C library tarballs.
      - name: Create JLL GitHub Releases
        env:
          JULIA_DEPLOY_TOKEN: ${{ secrets.JULIA_DEPLOY_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CPU JLL
          echo "=== Creating release on Moreau_CPU_jll.jl ==="
          CPU_TARBALLS=(dist/moreau-cpu-*.tar.gz)
          if [ ${#CPU_TARBALLS[@]} -gt 0 ] && [ -f "${CPU_TARBALLS[0]}" ]; then
            GH_TOKEN="$JULIA_DEPLOY_TOKEN" gh release create "v${VERSION}" \
              --repo optimalintellect/Moreau_CPU_jll.jl \
              --title "v${VERSION}" \
              --notes "Moreau CPU C library v${VERSION}" \
              "${CPU_TARBALLS[@]}"
            echo "Created release with: ${CPU_TARBALLS[*]}"
          else
            echo "WARNING: No CPU C library tarballs found"
          fi

          # CUDA JLL
          echo "=== Creating release on Moreau_CUDA_jll.jl ==="
          CUDA_TARBALLS=(dist/moreau-cuda*-*.tar.gz)
          if [ ${#CUDA_TARBALLS[@]} -gt 0 ] && [ -f "${CUDA_TARBALLS[0]}" ]; then
            GH_TOKEN="$JULIA_DEPLOY_TOKEN" gh release create "v${VERSION}" \
              --repo optimalintellect/Moreau_CUDA_jll.jl \
              --title "v${VERSION}" \
              --notes "Moreau CUDA C library v${VERSION}" \
              "${CUDA_TARBALLS[@]}"
            echo "Created release with: ${CUDA_TARBALLS[*]}"
          else
            echo "WARNING: No CUDA C library tarballs found"
          fi

      # Publish Python wheels to PyPI.
      - name: Separate wheels for PyPI
        run: |
          mkdir -p dist-pypi
          cp dist/*.whl dist-pypi/
          echo "=== Wheels for PyPI ==="
          ls -la dist-pypi/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/

  # Verify: install from PyPI and run tests
  verify-python:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract version from release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # v0.2.1 -> 0.2.1, dev-20260313-120000 -> extract from wheel later
          VERSION="${RELEASE_TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for PyPI to index all packages at this version
        # The publish job's upload returns 200 OK before PyPI's simple index
        # has caught up, and propagation is uneven across packages: we've
        # seen two of four visible and two missing 11s after upload. Poll
        # each package with `pip install --dry-run` (the same resolver the
        # real install uses), exit the step as soon as PyPI agrees, and fail
        # the job if it isn't consistent within 5 minutes.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -u
          PKGS=(moreau moreau-cpu moreau-cuda12 moreau-cuda13)
          pip install --upgrade pip -q
          start=$(date +%s)
          for pkg in "${PKGS[@]}"; do
            for attempt in $(seq 1 30); do
              if pip install --dry-run --no-deps "${pkg}==${VERSION}" >/dev/null 2>&1; then
                elapsed=$(( $(date +%s) - start ))
                echo "  ${pkg} ${VERSION} visible (attempt ${attempt}, ${elapsed}s elapsed)"
                continue 2
              fi
              sleep 10
            done
            echo "::error::Timed out waiting for ${pkg} ${VERSION} to appear on PyPI"
            exit 1
          done

      - name: Install from PyPI and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pip install --upgrade pip
          pip install "moreau==$VERSION"
          python -c "import moreau; print('moreau OK:', moreau.__version__)"
          pip install pytest numpy scipy hypothesis cvxpy clarabel
          pytest packages/moreau/tests/python/ -v --tb=short

  verify-julia:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Clone Julia packages from public repos
        run: |
          mkdir -p julia-src
          git clone --depth 1 https://github.com/optimalintellect/Moreau_CPU_jll.jl.git julia-src/Moreau_CPU_jll.jl
          git clone --depth 1 https://github.com/optimalintellect/Moreau_CUDA_jll.jl.git julia-src/Moreau_CUDA_jll.jl
          git clone --depth 1 https://github.com/optimalintellect/Moreau.jl.git julia-src/Moreau.jl

      - name: Test Julia packages
        run: |
          # Use Moreau.jl's own Project.toml so [sources] relative paths
          # to JLL packages resolve correctly
          julia --project=julia-src/Moreau.jl -e '
            using Pkg
            Pkg.Registry.add("General")
            Pkg.resolve()
            Pkg.test()
          '

  # Fast-forward the `release` branch to the published tag so the out-of-band
  # docs build picks up the version users actually install from PyPI. Only
  # runs after PyPI and Julia verification succeed, so docs never point at a
  # broken release. Uses a plain push (no --force); a non-fast-forward will
  # fail the job and require manual intervention.
  update-release-branch:
    needs: [verify-python, verify-julia]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward release branch to tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Verify the tag exists and get its commit.
          TAG_COMMIT="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "Fast-forwarding release -> ${RELEASE_TAG} (${TAG_COMMIT})"
          # Plain push (no --force): GitHub will reject a non-fast-forward.
          git push origin "${TAG_COMMIT}:refs/heads/release"
